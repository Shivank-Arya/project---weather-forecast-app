<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Application</title>
    <!-- External stylesheet linking your compiled Tailwind setup -->
    <link href="./style.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 antialiased font-sans">
    <!-- ROOT LAYOUT CONTAINER: Maintains identical frame structure for navigation consistency -->
    <div class="flex flex-col min-h-screen md:flex-row">
        <!-- =========================================================================
         1. LEFT SIDEBAR NAVIGATION PANEL (Shared Component)
         ========================================================================= -->
        <aside class="w-full bg-white border-b border-gray-200 p-4 md:p-6 md:w-64 md:border-r md:border-b-0 flex flex-col justify-between shrink-0">
            <div>
                <div class="flex items-center justify-between">
                    <!-- Brand Title -->
                    <a href="index.html">
                        <h1 class="text-2xl font-bold tracking-tight text-gray-900 mb-0">
                            Weather Channel
                        </h1>
                    </a>
                    <button id="nav-toggle" type="button"
                        class="md:hidden inline-flex items-center justify-center rounded-lg border border-gray-200 p-2 text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        aria-expanded="false" aria-controls="mobile-nav">
                        <span class="sr-only">Open navigation</span>
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>

                <!-- Navigational Routing Context Links -->
                <nav id="mobile-nav" class="mt-4 space-y-2 hidden md:block md:mt-6">
                    <!-- Active routing tab state shifted over to "Today" -->
                    <a href="index.html"
                        class="flex items-center space-x-3 px-4 py-2.5 rounded-lg font-semibold bg-blue-50 text-blue-600 transition">
                        <span>Today</span>
                    </a>
                    <a href="5day.html"
                        class="flex items-center space-x-3 px-4 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">
                        <span>5 Day</span>
                    </a>
                    <a href="aqi.html"
                        class="flex items-center space-x-3 px-4 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">
                        <span>Air Quality Index</span>
                    </a>
                </nav>
            </div>

            <div class="text-xs text-gray-400">
                Powered by OpenWeather
            </div>
        </aside>

        <!-- =========================================================================
         MAIN VIEWPORT DASHBOARD CONTENT AREA
         ========================================================================= -->
        <main class="flex-1 p-4 md:p-8 flex flex-col gap-6 max-w-5xl mx-auto w-full">

            <!-- =========================================================================
             2. TOP NAVBAR CONTROLS (Shared Component)
             ========================================================================= -->
            <header class="flex flex-col sm:flex-row gap-4 sm:items-center justify-between">
                <!-- Search Query Form Interface -->
                <form class="flex items-center max-w-sm w-full">
                    <label for="city-search" class="sr-only">Search City</label>
                    <div class="relative w-full">
                        <input type="text" id="city-search"
                            class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 pr-10"
                            placeholder="Search city..." required />
                        <button type="submit"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-blue-600">
                            <span>🔍</span>
                        </button>
                    </div>
                </form>

                <!-- Status Metadata Indicators and Unit Selection Panel -->
                <div class="flex items-center justify-end gap-6 text-sm font-medium text-gray-600">
                    <span
                        class="flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-full text-xs font-semibold text-gray-700">
                        🌐 IN
                    </span>
                    <div class="inline-flex rounded-md shadow-sm border border-gray-200 bg-white p-0.5" role="group">
                        <button type="button" id="unit-f"
                            class="px-3 py-1 text-xs font-medium text-gray-700 rounded-md hover:bg-gray-50">
                            °F
                        </button>
                        <button type="button" id="unit-c"
                            class="px-3 py-1 text-xs font-medium text-white bg-blue-600 rounded-md shadow-sm">
                            °C
                        </button>
                    </div>
                </div>
            </header>

            <!-- =========================================================================
             3. HERO COMPONENT: Today's Weather Card
             - Informing user about current temperature, Day/night temperature difference, humidity, sunrise/sunset time for the day and wind speed and direction. 
             ========================================================================= -->
            <section
                class="bg-linear-to-b from-blue-500 to-blue-600 text-white rounded-xl p-6 shadow-md border border-blue-700 max-w-full w-full">

                <!-- Current Location | Today's Date -->
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 id="current-location" class="text-3xl font-bold tracking-tight">Detecting location...</h2>
                    </div>
                    <span id="current-date"
                        class="text-sm font-medium bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full">
                        -- --- ----
                    </span>
                </div>

                <!-- Today's weather conditions -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center mb-6">
                    <div>
                        <div class="text-xs uppercase tracking-wider font-semibold opacity-80 mb-1">Weather Today</div>
                        <div class="flex items-center gap-4">
                            <span id="main-temp" class="text-6xl font-extrabold tracking-tighter">--°C</span>
                            <span id="weather-icon" class="text-5xl drop-shadow-md">⏳</span>
                        </div>
                        <div id="weather-condition" class="text-lg font-medium mt-1">...</div>
                    </div>

                    <!-- Day/Night Temperature difference | Sunrise/Sunset Times for the day -->
                    <div class="flex flex-col md:items-end gap-3 text-sm">
                        <div class="font-medium text-base">
                            Day - <span id="day-max" class="font-semibold">--°C</span> • Night - <span id="night-min"
                                class="font-semibold">--°C</span>
                        </div>
                        <div id="sun-intervals"
                            class="border border-white/30 border-dashed bg-white/5 p-2 rounded-lg text-xs leading-relaxed max-w-xs md:text-right">
                            <span class="block">🌅 Sunrise: <span class="font-semibold">--:-- AM</span></span>
                            <span class="block">🌇 Sunset: <span class="font-semibold">--:-- PM</span></span>
                        </div>
                    </div>
                </div>

                <!-- Humidity percentage | Wind Speed and Direction -->
                <div class="flex gap-8 border-t border-white/20 pt-4 text-sm font-medium">
                    <div class="flex items-center gap-2">
                        <span class="text-lg">💧</span>
                        <div>Humidity: <span id="humidity-value" class="font-semibold">--%</span></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-lg">💨</span>
                        <div>Wind: <span id="wind-value" class="font-semibold">-- km/h</span> <span id="wind-direction"
                                class="inline-block transition-transform duration-500">⬇️</span></div>
                    </div>
                </div>
            </section>

            <!-- =========================================================================
             4. SUB-HERO COMPONENT: Extended Forecast - 
              - Predictions about the forecast for the coming 5 days - expected weather conditions, day/night temperature difference and humidity level. 
             ========================================================================= -->
            <section class="max-w-full w-full">
                <h3 class="text-lg font-bold text-gray-900 mb-4">Extended Forecast</h3>
                <div id="forecast-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                    <!-- Cards will be dynamically injected here by JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="./index.js"></script>
</body>

</html>
