<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Application</title>
    <link href="./style.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 antialiased font-sans">

    <div class="flex min-h-screen">

        <aside class="w-64 bg-white border-r border-gray-200 p-6 flex flex-col justify-between shrink-0">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900 mb-8">
                    Weather Channel
                </h1>

                <nav class="space-y-2">
                    <a href="#"
                        class="flex items-center space-x-3 px-4 py-2.5 rounded-lg font-semibold bg-blue-50 text-blue-600 transition">
                        <span>Today</span>
                    </a>
                    <a href="#"
                        class="flex items-center space-x-3 px-4 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">
                        <span>5 day</span>
                    </a>
                    <a href="#"
                        class="flex items-center space-x-3 px-4 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">
                        <span>Air Quality Index</span>
                    </a>
                </nav>
            </div>

            <div class="text-xs text-gray-400">
                Powered by OpenWeather
            </div>
        </aside>

        <main class="flex-1 p-8 flex flex-col gap-6 max-w-5xl">

            <header class="flex flex-col sm:flex-row gap-4 sm:items-center justify-between">

                <form class="flex items-center max-w-sm w-full">
                    <label for="city-search" class="sr-only">Search City</label>
                    <div class="relative w-full">
                        <input type="text" id="city-search"
                            class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 pr-10"
                            placeholder="Search city..." required />
                        <button type="submit"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-blue-600">
                            <span>🔍</span>
                        </button>
                    </div>
                </form>

                <div class="flex items-center justify-end gap-6 text-sm font-medium text-gray-600">
                    <span
                        class="flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-full text-xs font-semibold text-gray-700">
                        🌐 IN
                    </span>
                    <div class="inline-flex rounded-md shadow-sm border border-gray-200 bg-white p-0.5" role="group">
                        <button type="button" id="unit-f"
                            class="px-3 py-1 text-xs font-medium text-gray-700 rounded-md hover:bg-gray-50">
                            °F
                        </button>
                        <button type="button" id="unit-c"
                            class="px-3 py-1 text-xs font-medium text-white bg-blue-600 rounded-md shadow-sm">
                            °C
                        </button>
                    </div>
                </div>
            </header>

            
        </main>
    </div>
    <script src="./index.js"></script>
</body>

</html>
